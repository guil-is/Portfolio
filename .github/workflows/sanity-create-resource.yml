name: Sanity — Create resource

# Adds, updates or deletes entries in the design resources library
# (/resources). Two trigger modes:
#   1. Automated: push .github/triggers/resources.json to main — the
#      /add-resources skill does this (the GitHub App can't dispatch
#      workflows and the sandbox can't reach Sanity, so a push is the
#      write path). The file carries { batch, dry_run, items }.
#   2. Manual: Actions tab → Run workflow → single fields or items_json.
# See scripts/sanity/create-resource.ts for item shapes.

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Title (single mode), e.g. 'Google Fonts'"
        required: false
        type: string
      url:
        description: "URL (single mode), e.g. https://fonts.google.com"
        required: false
        type: string
      category:
        description: "Category value or title (single mode), e.g. 'typography' or 'Icons & Illustration'"
        required: false
        type: string
      description:
        description: "One line on why it's here (optional)"
        required: false
        type: string
      tags:
        description: "Comma-separated tags (optional), e.g. 'free, variable'"
        required: false
        type: string
      rating:
        description: "1–5, 5 = essential (optional)"
        required: false
        type: string
      items_json:
        description: "Bulk mode: JSON array of {url,title,category,description?,tags?,rating?} to create/update, or {url,delete:true}. Overrides the single fields."
        required: false
        type: string
      dry_run:
        description: "When true, log the plan without mutating"
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [".github/triggers/resources.json"]

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create / update / delete resource(s)
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          TITLE: ${{ inputs.title }}
          RESOURCE_URL: ${{ inputs.url }}
          CATEGORY: ${{ inputs.category }}
          DESCRIPTION: ${{ inputs.description }}
          TAGS: ${{ inputs.tags }}
          RATING: ${{ inputs.rating }}
          ITEMS_JSON: ${{ inputs.items_json }}
          DRY_RUN: ${{ inputs.dry_run }}
          # On push the inputs above are empty and the trigger file
          # carries items + dry_run; the script reads it directly so
          # no shell quoting of JSON is involved.
          ITEMS_FILE: ${{ github.event_name == 'push' && '.github/triggers/resources.json' || '' }}
        run: npx tsx scripts/sanity/create-resource.ts
